name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: typecheck · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # >= 22.5 required for node:sqlite
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (oxlint, ESLint-compatible rules)
        run: npm run lint

      - name: Build (SPA + Cloudflare worker + Node server)
        run: npm run build

      - name: Bundle size report
        run: |
          echo "### Bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          du -h dist/_worker.js server-dist/node.mjs >> "$GITHUB_STEP_SUMMARY"
          ls -S -l dist/assets | head -8 >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests (pure analytics / insight helpers)
        run: npm run test:unit

      - name: E2E (smoke for every role + admin write paths)
        run: npm test

      - name: Cloudflare runtime smoke (wrangler pages dev, local D1)
        run: |
          npx wrangler pages dev dist --d1=DB --local --ip 127.0.0.1 --port 8788 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8788/api/health && break; sleep 2; done
          npm run test:cf || (cat /tmp/wrangler.log; exit 1)

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nashriyar:ci .
      - name: Boot container and probe /api/health
        run: |
          docker run -d --name nsh -p 3000:3000 nashriyar:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health && exit 0
            sleep 1
          done
          docker logs nsh
          exit 1
