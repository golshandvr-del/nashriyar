# Nashriyar — Nginx reverse proxy (TLS termination, HTTP/2, compression, static caching).
# Used by docker-compose.yml (mounted as /etc/nginx/conf.d/default.conf).
# Replace nashriyar.example.ac.ir with the real domain; certificates come from certbot (see docs/OPERATIONS.md).

upstream nashriyar_app {
  server app:3000;
  keepalive 32;
}

# Simple per-IP limits in front of the app's own rate limiting.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
  listen 80;
  listen [::]:80;
  server_name nashriyar.example.ac.ir;

  # ACME http-01 challenge for Let's Encrypt
  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name nashriyar.example.ac.ir;

  ssl_certificate     /etc/letsencrypt/live/nashriyar.example.ac.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nashriyar.example.ac.ir/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Uploads: the app accepts at most 95 MB per file (PDF/audio/video).
  client_max_body_size 100m;
  client_body_timeout 300s;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  # Overwrite (never append) client IP headers so they cannot be spoofed; the app trusts X-Real-IP.
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header CF-Connecting-IP "";
  proxy_read_timeout 120s;
  proxy_request_buffering off;

  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://nashriyar_app;
  }

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://nashriyar_app;
  }

  # Hashed build assets never change: cache for a year.
  location /assets/ {
    proxy_pass http://nashriyar_app;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Service worker and HTML must always be revalidated so updates roll out.
  location = /sw.js {
    proxy_pass http://nashriyar_app;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    proxy_pass http://nashriyar_app;
  }

  # Friendly maintenance page while the app container is stopped/restarting (upgrade, restore).
  # The file is mounted read-only by docker-compose.yml; it uses no app assets.
  proxy_intercept_errors off;
  error_page 502 503 504 /maintenance.html;
  location = /maintenance.html {
    root /usr/share/nginx/maintenance;
    internal;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
  }
}
