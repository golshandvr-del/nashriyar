<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/theme-init.js"></script>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: Vazirmatn, Tahoma, sans-serif; background: #f6f7f9; color: #111827; }

      h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
      p { opacity: .75; line-height: 1.9; font-size: .95rem; }
      a { display: inline-block; margin-top: 1rem; padding: .6rem 1.4rem; border-radius: .75rem; background: #0f766e; color: #fff; text-decoration: none; font-weight: 700; }

    <main>
      <img src="/favicon.svg" alt="" width="64" height="64" />

      <a href="/">تلاش دوباره</a>
